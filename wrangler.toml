name = "cartodata-web"
type = "service"

[[d1_databases]]
binding = "DB"
database_name = "cartodata"
database_id = "54116fca-9c2e-4afc-b816-ec842b951633"
preview_database_id = "PLACEHOLDER_PREVIEW_ID"
migrations_dir = "functions/migrations"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "cartodata-images"
preview_bucket_name = "cartodata-images-preview"

[[kv_namespaces]]
binding = "GALLERY_KV"
id = "gallery_kv_namespace"

[[kv_namespaces]]
binding = "DRAFTS_KV"
id = "drafts_kv_namespace"

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "rate_limit_namespace"

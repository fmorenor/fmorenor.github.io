<svg viewBox="0 0 400 150" xmlns="http://www.w3.org/2000/svg">
  <!-- Globe part -->
  <g transform="translate(80, 40)">
    <!-- Outer circles -->
    <circle cx="30" cy="30" r="28" fill="none" stroke="black" stroke-width="8"/>
    <circle cx="30" cy="30" r="20" fill="none" stroke="black" stroke-width="2"/>

    <!-- Grid lines -->
    <g stroke="black" stroke-width="2" fill="none">
      <!-- Vertical lines -->
      <line x1="10" y1="10" x2="10" y2="50"/>
      <line x1="18" y1="8" x2="18" y2="52"/>
      <line x1="26" y1="6" x2="26" y2="54"/>
      <line x1="34" y1="6" x2="34" y2="54"/>
      <line x1="42" y1="8" x2="42" y2="52"/>
      <line x1="50" y1="10" x2="50" y2="50"/>

      <!-- Horizontal lines -->
      <line x1="10" y1="15" x2="50" y2="15"/>
      <line x1="8" y1="23" x2="52" y2="23"/>
      <line x1="6" y1="30" x2="54" y2="30"/>
      <line x1="8" y1="37" x2="52" y2="37"/>
      <line x1="10" y1="45" x2="50" y2="45"/>
    </g>

    <!-- Center vertical bar -->
    <rect x="28" y="10" width="4" height="40" fill="black"/>
  </g>

  <!-- Text "CARTODATA" -->
  <text x="180" y="85" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="black">CARTODATA</text>

  <!-- Small registered mark -->
  <circle cx="395" cy="75" r="4" fill="black"/>
  <text x="390" y="80" font-family="Arial, sans-serif" font-size="8" fill="black">®</text>
</svg>

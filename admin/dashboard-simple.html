<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CartoData - Admin</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; }

    .login-page { display: flex; min-height: 100vh; align-items: center; justify-content: center; background: linear-gradient(135deg, #0066cc 0%, #0052a3 100%); }
    .login-box { background: white; padding: 50px 40px; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); max-width: 400px; width: 100%; }
    .login-box h1 { font-size: 32px; margin-bottom: 8px; }
    .login-box p { color: #666; margin-bottom: 30px; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 8px; font-weight: 600; }
    .form-group input { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 15px; }
    .form-group input:focus { outline: none; border-color: #0066cc; }
    .btn { width: 100%; padding: 12px; background: #0066cc; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; }
    .btn:hover { background: #0052a3; }
    .error { color: #ff3b30; margin-top: 15px; text-align: center; }

    .dashboard { display: none; }
    .dashboard.active { display: flex; flex-direction: column; min-height: 100vh; }

    .header { background: white; padding: 20px; border-bottom: 1px solid #e0e0e0; display: flex; justify-content: space-between; align-items: center; }
    .header h1 { font-size: 24px; }
    .logout-btn { padding: 10px 16px; background: #ff3b30; color: white; border: none; border-radius: 6px; cursor: pointer; }

    .nav { background: #f9f9f9; border-bottom: 1px solid #e0e0e0; padding: 0 20px; display: flex; gap: 30px; }
    .nav a { padding: 15px 0; text-decoration: none; color: #666; font-weight: 500; border-bottom: 3px solid transparent; cursor: pointer; }
    .nav a.active { color: #0066cc; border-bottom-color: #0066cc; }

    .main { flex: 1; padding: 30px 20px; max-width: 1400px; margin: 0 auto; width: 100%; }
    .tab { display: none; }
    .tab.active { display: block; }

    .empty-state { text-align: center; padding: 40px; background: white; border-radius: 8px; color: #666; }
    .btn-new { padding: 10px 16px; background: #0066cc; color: white; border: none; border-radius: 6px; cursor: pointer; margin-bottom: 20px; }

    .loader { text-align: center; color: #666; padding: 40px; }
    .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; }
    .gallery-item { border: 1px solid #e0e0e0; border-radius: 8px; overflow: hidden; }
    .gallery-item img { width: 100%; height: 150px; object-fit: cover; }
    .gallery-item p { padding: 10px; font-size: 12px; background: #f5f5f5; }
  </style>
</head>
<body>

<!-- Login -->
<div id="loginPage" class="login-page">
  <div class="login-box">
    <h1>CartoData Admin</h1>
    <p>Acceso restringido</p>
    <form id="loginForm">
      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" id="password" required>
      </div>
      <button type="submit" class="btn">Acceder</button>
    </form>
    <div id="loginError" class="error"></div>
  </div>
</div>

<!-- Dashboard -->
<div id="dashboard" class="dashboard">
  <div class="header">
    <h1>CartoData Admin</h1>
    <button id="logoutBtn" class="logout-btn">Salir</button>
  </div>

  <div class="nav">
    <a href="#" data-tab="posts" class="nav-link active">📝 Artículos</a>
    <a href="#" data-tab="images" class="nav-link">🖼️ Galería</a>
  </div>

  <div class="main">
    <!-- Posts -->
    <div id="postsTab" class="tab active">
      <h2>Artículos</h2>
      <button class="btn-new" id="newPostBtn">+ Nuevo Artículo</button>
      <div id="postsList" class="loader">Cargando...</div>
    </div>

    <!-- Images -->
    <div id="imagesTab" class="tab">
      <h2>Galería</h2>
      <div id="uploadArea" style="border: 2px dashed #0066cc; border-radius: 8px; padding: 30px; text-align: center; background: #f0f5ff; margin-bottom: 20px; cursor: pointer;">
        <p>Arrastra imágenes aquí o haz clic para seleccionar</p>
        <input type="file" id="fileInput" multiple accept="image/*" style="display: none;">
      </div>
      <div id="imagesList" class="loader">Cargando...</div>
    </div>
  </div>
</div>

<script>
// Config
const API_BASE = '/api/admin';
const PASSWORD_KEY = 'adminToken';

// Simple auth
async function login(password) {
  try {
    const res = await fetch(`${API_BASE}/posts`, {
      headers: { 'Authorization': `Bearer ${password}`, 'X-Admin-Password': password }
    });

    if (!res.ok) {
      document.getElementById('loginError').textContent = 'Contraseña incorrecta';
      return;
    }

    localStorage.setItem(PASSWORD_KEY, password);
    showDashboard();
    loadPosts();
  } catch (e) {
    document.getElementById('loginError').textContent = 'Error: ' + e.message;
  }
}

function logout() {
  localStorage.removeItem(PASSWORD_KEY);
  showLogin();
}

function getToken() {
  return localStorage.getItem(PASSWORD_KEY);
}

function isLoggedIn() {
  return !!getToken();
}

// UI
function showLogin() {
  document.getElementById('loginPage').style.display = 'flex';
  document.getElementById('dashboard').classList.remove('active');
}

function showDashboard() {
  document.getElementById('loginPage').style.display = 'none';
  document.getElementById('dashboard').classList.add('active');
}

// Login form
document.getElementById('loginForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const password = document.getElementById('password').value;
  document.getElementById('loginError').textContent = '';
  login(password);
});

document.getElementById('logoutBtn').addEventListener('click', logout);

// Upload images
const uploadArea = document.getElementById('uploadArea');
const fileInput = document.getElementById('fileInput');

uploadArea.addEventListener('click', () => fileInput.click());
uploadArea.addEventListener('dragover', (e) => {
  e.preventDefault();
  uploadArea.style.background = '#e0e7ff';
});
uploadArea.addEventListener('dragleave', () => {
  uploadArea.style.background = '#f0f5ff';
});
uploadArea.addEventListener('drop', (e) => {
  e.preventDefault();
  uploadArea.style.background = '#f0f5ff';
  handleFileUpload(e.dataTransfer.files);
});

fileInput.addEventListener('change', (e) => {
  handleFileUpload(e.target.files);
});

async function handleFileUpload(files) {
  const token = getToken();

  for (let file of files) {
    const formData = new FormData();
    formData.append('file', file);
    formData.append('category', 'blog');

    try {
      const res = await fetch(`${API_BASE}/images`, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${token}`, 'X-Admin-Password': token },
        body: formData
      });

      if (res.ok) {
        console.log('Imagen subida:', file.name);
      } else {
        alert('Error subiendo ' + file.name);
      }
    } catch (e) {
      alert('Error: ' + e.message);
    }
  }

  loadImages();
}

// New Post
document.getElementById('newPostBtn').addEventListener('click', async () => {
  const title = prompt('Título del artículo:');
  if (!title) return;

  const slug = title.toLowerCase().replace(/\s+/g, '-');
  const content = prompt('Contenido (HTML):') || '<p>Contenido aquí</p>';
  const category = prompt('Categoría:') || 'general';

  const token = getToken();
  try {
    const res = await fetch(`${API_BASE}/posts`, {
      method: 'POST',
      headers: {
        'Authorization': `Bearer ${token}`,
        'X-Admin-Password': token,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ slug, title, content, category, status: 'published' })
    });

    if (res.ok) {
      alert('Artículo creado');
      loadPosts();
    } else {
      alert('Error: ' + (await res.text()));
    }
  } catch (e) {
    alert('Error: ' + e.message);
  }
});

// Tabs
document.querySelectorAll('.nav-link').forEach(link => {
  link.addEventListener('click', (e) => {
    e.preventDefault();
    const tab = e.target.dataset.tab;
    document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
    e.target.classList.add('active');
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.getElementById(tab + 'Tab').classList.add('active');

    if (tab === 'images') loadImages();
  });
});

// API calls
async function loadPosts() {
  const token = getToken();
  try {
    const res = await fetch(`${API_BASE}/posts`, {
      headers: { 'Authorization': `Bearer ${token}`, 'X-Admin-Password': token }
    });
    const data = await res.json();
    const html = data.articles?.length
      ? `<p>${data.articles.length} artículos</p>`
      : '<div class="empty-state">No hay artículos</div>';
    document.getElementById('postsList').innerHTML = html;
  } catch (e) {
    document.getElementById('postsList').innerHTML = '<div class="error">Error cargando</div>';
  }
}

async function loadImages() {
  const token = getToken();
  try {
    const res = await fetch(`${API_BASE}/images`, {
      headers: { 'Authorization': `Bearer ${token}`, 'X-Admin-Password': token }
    });
    const data = await res.json();

    if (!data.images || data.images.length === 0) {
      document.getElementById('imagesList').innerHTML = '<div class="empty-state">No hay imágenes</div>';
      return;
    }

    const html = '<div class="gallery">' +
      data.images.map(img => `
        <div class="gallery-item">
          <img src="${img.url}" alt="${img.filename}" loading="lazy">
          <p>${img.filename}</p>
        </div>
      `).join('') +
      '</div>';
    document.getElementById('imagesList').innerHTML = html;
  } catch (e) {
    console.error('Error cargando imágenes:', e);
    document.getElementById('imagesList').innerHTML = '<div class="error">Error cargando imágenes</div>';
  }
}

// Init
if (isLoggedIn()) {
  showDashboard();
  loadPosts();
} else {
  showLogin();
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>X-Ray · Diagnóstico geoespacial con IA — CartoData</title>
  <meta name="description" content="Cuéntanos tu reto geoespacial y nuestro asistente te orienta al instante. Diagnóstico X-Ray de CartoData." />
  <link rel="canonical" href="https://www.cartodata.com/xray.html" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://www.cartodata.com/xray.html" />
  <meta property="og:title" content="X-Ray — CartoData" />
  <meta property="og:description" content="Diagnóstico geoespacial conversacional con IA." />
  <meta property="og:locale" content="es_MX" />
  <meta property="og:site_name" content="CartoData" />
  <script src="./shared.js" defer></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }
    body { background: #050816; color: #f8fafc; font-family: 'DM Sans', system-ui, sans-serif; }
    img { display: block; max-width: 100%; }

    .xray-wrap {
      max-width: 900px; margin: 0 auto;
      padding: clamp(7rem,13vw,10rem) clamp(1.2rem,5vw,2rem) clamp(4rem,8vw,6rem);
    }

    /* ── ENCABEZADO ── */
    .xray-head { text-align: center; margin-bottom: 2.5rem; }
    .xray-eyebrow {
      display: inline-flex; align-items: center; gap: 0.5rem;
      font-size: 0.68rem; font-weight: 600; letter-spacing: 0.18em;
      text-transform: uppercase; color: rgba(255,255,255,0.45); margin-bottom: 1.1rem;
    }
    .xray-eyebrow .dot { width: 7px; height: 7px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 0 0 rgba(34,197,94,0.6); animation: pulse 2s infinite; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(34,197,94,0.5);} 70% { box-shadow: 0 0 0 8px rgba(34,197,94,0);} 100% { box-shadow: 0 0 0 0 rgba(34,197,94,0);} }
    .xray-h1 {
      font-size: clamp(2rem,5vw,3.4rem); font-weight: 200; line-height: 1.12; color: #fff; margin-bottom: 0.9rem;
    }
    .xray-h1 strong { font-weight: 800; }
    .xray-sub {
      font-size: clamp(0.98rem,1.6vw,1.12rem); font-weight: 300; line-height: 1.7;
      color: rgba(255,255,255,0.6); max-width: 620px; margin: 0 auto;
    }

    /* ── CONTENEDOR CHAT ── */
    .chat {
      background: linear-gradient(180deg, #0d1226 0%, #0a0f20 100%);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 22px; overflow: hidden;
      box-shadow: 0 30px 80px rgba(0,0,0,0.5);
      display: flex; flex-direction: column;
      height: min(640px, 78vh);
    }
    .chat-topbar {
      display: flex; align-items: center; gap: 0.8rem;
      padding: 1rem 1.3rem; border-bottom: 1px solid rgba(255,255,255,0.07);
      background: rgba(255,255,255,0.02);
    }
    .chat-avatar {
      width: 38px; height: 38px; border-radius: 11px; flex-shrink: 0;
      background: linear-gradient(135deg, #3b5bdb, #6366f1);
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 0.95rem; color: #fff;
    }
    .chat-topbar-info h3 { font-size: 0.92rem; font-weight: 700; color: #fff; }
    .chat-topbar-info p { font-size: 0.72rem; color: rgba(255,255,255,0.45); display: flex; align-items: center; gap: 0.35rem; }
    .chat-topbar-info p .dot { width: 6px; height: 6px; border-radius: 50%; background: #22c55e; }
    .chat-demo-pill {
      margin-left: auto; font-size: 0.6rem; font-weight: 700; letter-spacing: 0.1em;
      text-transform: uppercase; color: #fcd34d; background: rgba(252,211,77,0.12);
      border: 1px solid rgba(252,211,77,0.3); border-radius: 999px; padding: 0.25rem 0.65rem;
    }

    /* ── MENSAJES ── */
    .chat-messages {
      flex: 1; overflow-y: auto; padding: 1.5rem 1.3rem;
      display: flex; flex-direction: column; gap: 0.9rem;
      scroll-behavior: smooth;
    }
    .msg { display: flex; max-width: 82%; animation: fadeUp 300ms ease both; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(8px);} to { opacity: 1; transform: none;} }
    .msg-bubble {
      padding: 0.8rem 1.05rem; border-radius: 16px; font-size: 0.92rem; line-height: 1.55;
    }
    .msg.bot { align-self: flex-start; }
    .msg.bot .msg-bubble {
      background: rgba(255,255,255,0.06); color: #eef2ff;
      border: 1px solid rgba(255,255,255,0.05); border-bottom-left-radius: 5px;
    }
    .msg.user { align-self: flex-end; }
    .msg.user .msg-bubble {
      background: #3b5bdb; color: #fff; border-bottom-right-radius: 5px;
    }

    /* ── TYPING ── */
    .typing { display: flex; gap: 4px; padding: 0.95rem 1.1rem; }
    .typing span {
      width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,0.4);
      animation: blink 1.2s infinite both;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%,80%,100% { opacity: 0.25; transform: translateY(0);} 40% { opacity: 1; transform: translateY(-3px);} }

    /* ── QUICK REPLIES ── */
    .quick-replies { display: flex; flex-wrap: wrap; gap: 0.5rem; padding: 0 1.3rem 0.4rem; }
    .quick-reply {
      font-size: 0.82rem; font-weight: 500; color: #c7d2fe;
      background: rgba(59,91,219,0.14); border: 1px solid rgba(59,91,219,0.4);
      border-radius: 999px; padding: 0.45rem 0.95rem; cursor: pointer;
      transition: background 180ms, transform 150ms;
    }
    .quick-reply:hover { background: rgba(59,91,219,0.28); transform: translateY(-1px); }

    /* ── INPUT ── */
    .chat-input {
      display: flex; gap: 0.6rem; padding: 1rem 1.3rem;
      border-top: 1px solid rgba(255,255,255,0.07); background: rgba(255,255,255,0.02);
    }
    .chat-input input {
      flex: 1; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px; padding: 0.8rem 1rem; color: #fff; font-size: 0.92rem;
      font-family: inherit; outline: none; transition: border-color 180ms;
    }
    .chat-input input:focus { border-color: rgba(59,91,219,0.7); }
    .chat-input input::placeholder { color: rgba(255,255,255,0.35); }
    .chat-send {
      width: 46px; height: 46px; flex-shrink: 0; border: none; border-radius: 12px;
      background: #3b5bdb; color: #fff; font-size: 1.1rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 180ms, transform 150ms;
    }
    .chat-send:hover { background: #2d4bbd; transform: translateY(-1px); }
    .chat-send:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    /* ── RESUMEN / CONFIRMACIÓN ── */
    .lead-summary {
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.09);
      border-radius: 16px; padding: 1.1rem 1.2rem; margin-top: 0.3rem;
      align-self: flex-start; max-width: 100%; width: 100%;
    }
    .lead-summary h4 { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; color: #93a8f4; margin-bottom: 0.8rem; }
    .lead-summary .row { display: flex; justify-content: space-between; gap: 1rem; font-size: 0.85rem; padding: 0.35rem 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .lead-summary .row:last-child { border-bottom: none; }
    .lead-summary .row span:first-child { color: rgba(255,255,255,0.45); }
    .lead-summary .row span:last-child { color: #fff; font-weight: 500; text-align: right; }

    .chat-done {
      text-align: center; padding: 2.2rem 1.5rem; animation: fadeUp 400ms ease both;
    }
    .chat-done .check {
      width: 62px; height: 62px; border-radius: 50%; margin: 0 auto 1.1rem;
      background: rgba(34,197,94,0.15); border: 1px solid rgba(34,197,94,0.4);
      display: flex; align-items: center; justify-content: center; font-size: 1.7rem;
    }
    .chat-done h3 { font-size: 1.35rem; font-weight: 700; color: #fff; margin-bottom: 0.6rem; }
    .chat-done p { font-size: 0.92rem; color: rgba(255,255,255,0.6); line-height: 1.6; max-width: 420px; margin: 0 auto 1.5rem; }
    .chat-restart {
      display: inline-block; padding: 0.75rem 1.8rem; background: transparent; color: #fff;
      border: 1px solid rgba(255,255,255,0.3); border-radius: 999px; font-size: 0.88rem;
      font-weight: 500; cursor: pointer; transition: background 180ms;
    }
    .chat-restart:hover { background: rgba(255,255,255,0.08); }

    .chat-close {
      display: flex; flex-direction: column; align-items: center; gap: 0.8rem;
      padding: 1.1rem 1.3rem; border-top: 1px solid rgba(255,255,255,0.07);
      background: rgba(255,255,255,0.02);
    }
    .chat-close span { font-size: 0.78rem; color: rgba(255,255,255,0.4); }

    @media(max-width:600px) {
      .msg { max-width: 90%; }
      .chat { height: min(600px, 82vh); }
    }
  </style>
</head>
<body>

  <div class="xray-wrap">
    <div class="xray-head">
      <p class="xray-eyebrow"><span class="dot"></span> X-Ray · Diagnóstico geoespacial</p>
      <h1 class="xray-h1">Cuéntanos tu reto,<br><strong>te orientamos al instante</strong></h1>
      <p class="xray-sub">Nuestro asistente hace una radiografía de tu proyecto en un par de minutos y te conecta con el equipo de CartoData indicado para resolverlo.</p>
    </div>

    <div class="chat" id="chat">
      <div class="chat-topbar">
        <div class="chat-avatar">CD</div>
        <div class="chat-topbar-info">
          <h3>Asistente CartoData</h3>
          <p><span class="dot"></span> En línea</p>
        </div>
        <span class="chat-demo-pill">Demo</span>
      </div>

      <div class="chat-messages" id="messages"></div>
      <div class="quick-replies" id="quickReplies" style="display:none;"></div>

      <form class="chat-input" id="inputForm" autocomplete="off">
        <input type="text" id="msgInput" placeholder="Escribe tu respuesta…" aria-label="Mensaje" />
        <button type="submit" class="chat-send" id="sendBtn" aria-label="Enviar">→</button>
      </form>
    </div>
  </div>

  <script>
  (function() {
    // ─────────────────────────────────────────────────────────────
    //  X-RAY — asistente conversacional con IA.
    //  El navegador solo habla con /api/chat (Cloudflare Pages Function),
    //  que hace de proxy seguro a Claude y registra el lead en CartoFlow.
    //  La API key vive únicamente en el servidor, nunca aquí.
    // ─────────────────────────────────────────────────────────────

    const messagesEl = document.getElementById('messages');
    const quickEl    = document.getElementById('quickReplies');
    const form       = document.getElementById('inputForm');
    const input      = document.getElementById('msgInput');
    const sendBtn    = document.getElementById('sendBtn');
    const chat       = document.getElementById('chat');

    // Historial de la conversación en formato de la API (solo turnos de texto).
    const history = [];

    const GREETING = '¡Hola! 👋 Soy el asistente de CartoData. Cuéntame: ¿qué reto o necesidad geoespacial estás buscando resolver?';

    function scrollDown() { messagesEl.scrollTop = messagesEl.scrollHeight; }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    }

    function addMessage(text, who) {
      const wrap = document.createElement('div');
      wrap.className = 'msg ' + who;
      const bubble = document.createElement('div');
      bubble.className = 'msg-bubble';
      bubble.innerHTML = escapeHtml(text).replace(/\n/g, '<br>');
      wrap.appendChild(bubble);
      messagesEl.appendChild(wrap);
      scrollDown();
    }

    function showTyping() {
      const wrap = document.createElement('div');
      wrap.className = 'msg bot';
      wrap.id = 'typing';
      wrap.innerHTML = '<div class="msg-bubble"><div class="typing"><span></span><span></span><span></span></div></div>';
      messagesEl.appendChild(wrap);
      scrollDown();
    }
    function hideTyping() { const t = document.getElementById('typing'); if (t) t.remove(); }

    function setInputEnabled(on) {
      input.disabled = !on; sendBtn.disabled = !on;
      if (on) input.focus();
    }

    async function sendToAssistant() {
      showTyping();
      setInputEnabled(false);
      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ messages: history })
        });
        const data = await res.json().catch(() => ({}));
        hideTyping();
        const reply = (data && data.reply) ? data.reply : 'Perdona, no pude procesar eso. ¿Puedes intentarlo de nuevo?';
        addMessage(reply, 'bot');
        history.push({ role: 'assistant', content: reply });

        // El registro del lead NO cierra la conversación: seguimos disponibles.
        // Solo cerramos cuando el asistente se despide y finaliza explícitamente.
        if (data && data.conversation_ended) {
          setTimeout(closeConversation, 500);
          return;
        }
        setInputEnabled(true);
      } catch (e) {
        hideTyping();
        addMessage('Ups, tuve un problema de conexión. Intenta de nuevo en un momento.', 'bot');
        setInputEnabled(true);
      }
    }

    function handleUserInput(value) {
      value = (value || '').trim();
      if (!value) return;
      addMessage(value, 'user');
      history.push({ role: 'user', content: value });
      sendToAssistant();
    }

    // Cierre suave: conserva toda la conversación a la vista, desactiva el input
    // y ofrece reiniciar. Nunca borra el historial de golpe.
    function closeConversation() {
      setInputEnabled(false);
      form.style.display = 'none';
      const bar = document.createElement('div');
      bar.className = 'chat-close';
      bar.innerHTML = '<span>Conversación finalizada · gracias por tu visita</span>' +
        '<button class="chat-restart" id="restartBtn">Iniciar otra conversación</button>';
      chat.appendChild(bar);
      document.getElementById('restartBtn').addEventListener('click', () => location.reload());
    }

    form.addEventListener('submit', e => {
      e.preventDefault();
      if (input.disabled) return;
      const v = input.value;
      input.value = '';
      handleUserInput(v);
    });

    // Arranque: saludo estático (sin llamada a la API). El historial arranca
    // vacío para que el primer mensaje enviado a la API sea del usuario.
    addMessage(GREETING, 'bot');
    setInputEnabled(true);
  })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- SEO: Personaliza estos valores para cada artículo -->
  <title>TITULO DEL ARTICULO · Blog — CartoData</title>
  <meta name="description" content="DESCRIPCION BREVE DEL ARTICULO (máx 160 caracteres)." />
  <link rel="canonical" href="https://www.cartodata.com/blog/nombre-del-archivo.html" />

  <!-- Open Graph para redes sociales -->
  <meta property="og:type" content="article" />
  <meta property="og:url" content="https://www.cartodata.com/blog/nombre-del-archivo.html" />
  <meta property="og:title" content="TITULO DEL ARTICULO · Blog — CartoData" />
  <meta property="og:description" content="DESCRIPCION BREVE PARA REDES SOCIALES." />
  <meta property="og:locale" content="es_MX" />
  <meta property="og:site_name" content="CartoData" />
  <meta property="og:image" content="URL DE LA IMAGEN HERO" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="TITULO DEL ARTICULO · Blog — CartoData" />
  <meta name="twitter:description" content="DESCRIPCION BREVE PARA TWITTER." />
  <meta name="twitter:image" content="URL DE LA IMAGEN HERO" />

  <!-- Autor y fecha -->
  <meta name="author" content="CartoData" />
  <meta name="article:published_time" content="YYYY-MM-DDTHH:MM:SSZ" />
  <meta name="article:modified_time" content="YYYY-MM-DDTHH:MM:SSZ" />

  <script src="../shared.js" defer></script>
  <script defer>
    /* Corregir ruta del logo en páginas de blog (que están en /blog/) */
    document.addEventListener('DOMContentLoaded', () => {
      const logo = document.getElementById('cd-nav-logo');
      if (logo && !logo.src.includes('manus-storage')) {
        const isDark = document.documentElement.getAttribute('data-theme') !== 'light';
        logo.src = isDark
          ? '../manus-storage/logo-white-h-proper_641226e9.png'
          : '../manus-storage/logo-black-h-proper_e8a1da9d.png';
      }
    });
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }
    body { background: #050816; color: #f8fafc; font-family: 'DM Sans', system-ui, sans-serif; }
    img { display: block; max-width: 100%; }

    /* ── HERO ── */
    .blog-hero {
      position: relative;
      width: 100%;
      min-height: 60vh;
      display: flex;
      align-items: flex-end;
      overflow: hidden;
      padding-bottom: 3rem;
    }
    .blog-hero-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }
    .blog-hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(5,8,22,0) 0%, rgba(5,8,22,0.95) 100%);
    }
    .blog-hero-content {
      position: relative;
      z-index: 2;
      max-width: 860px;
      padding: 0 clamp(1.5rem, 6vw, 4rem);
      width: 100%;
    }
    .blog-eyebrow {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.5);
      margin-bottom: 1rem;
    }
    .blog-category {
      display: inline-block;
      padding: 0.4rem 1rem;
      background: rgba(59, 91, 219, 0.2);
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #7dd3fc;
      margin-right: 0.8rem;
    }
    .blog-h1 {
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 300;
      line-height: 1.2;
      color: #fff;
      margin-bottom: 1rem;
    }
    .blog-subtitle {
      font-size: clamp(1rem, 2vw, 1.2rem);
      font-weight: 300;
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.7);
      max-width: 600px;
    }

    /* ── CONTENEDOR ── */
    .blog-container {
      max-width: 900px;
      margin: 0 auto;
      padding: clamp(3rem, 8vw, 5rem) clamp(1.5rem, 6vw, 4rem);
    }

    /* ── CONTENIDO ── */
    .blog-content {
      line-height: 1.8;
      font-size: 1.05rem;
      color: rgba(255, 255, 255, 0.9);
    }
    .blog-content h2 { font-size: 2rem; font-weight: 600; color: #fff; margin: 2.5rem 0 1.5rem; }
    .blog-content h3 { font-size: 1.4rem; font-weight: 600; color: #fff; margin: 2rem 0 1rem; }
    .blog-content p { margin-bottom: 1.5rem; }
    .blog-content strong { color: #fff; font-weight: 600; }
    .blog-content em { font-style: italic; color: rgba(255,255,255,0.9); }
    .blog-content a { color: #7dd3fc; text-decoration: none; border-bottom: 1px solid rgba(125,211,252,0.3); transition: border-color 250ms; }
    .blog-content a:hover { border-bottom-color: rgba(125,211,252,0.8); }
    .blog-content ul, .blog-content ol { margin: 1.5rem 0 1.5rem 2rem; }
    .blog-content li { margin-bottom: 0.8rem; }
    .blog-content blockquote { border-left: 4px solid #7dd3fc; padding-left: 1.5rem; margin: 2rem 0; color: rgba(255,255,255,0.8); font-style: italic; }
    .blog-content pre { background: rgba(0,0,0,0.3); border: 1px solid rgba(125,211,252,0.2); border-radius: 6px; padding: 1.5rem; overflow-x: auto; margin: 2rem 0; font-family: 'Courier New', monospace; }
    .blog-content code { font-family: 'Courier New', monospace; font-size: 0.9em; color: #7dd3fc; }
    .blog-content img { max-width: 100%; height: auto; border-radius: 8px; margin: 2rem 0; }

    /* ── VIDEOS EMBEBIDOS ── */
    .blog-content .video-container {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      margin: 2rem 0;
      border-radius: 8px;
    }
    .blog-content .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 8px;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 768px) {
      .blog-hero { min-height: 50vh; }
      .blog-content { font-size: 1rem; }
      .blog-content h2 { font-size: 1.6rem; }
      .blog-content h3 { font-size: 1.2rem; }
    }
  </style>
</head>

<body>
  <!-- HERO DEL ARTICULO -->
  <section class="blog-hero" style="background-image: url('URL_DE_LA_IMAGEN_HERO');">
    <img src="URL_DE_LA_IMAGEN_HERO" alt="Hero" class="blog-hero-bg" />
    <div class="blog-hero-overlay"></div>
    <div class="blog-hero-content">
      <div class="blog-eyebrow">
        <span class="blog-category">CATEGORIA</span>
        DD de MESES de YYYY
      </div>
      <h1 class="blog-h1">TITULO DEL ARTICULO</h1>
      <p class="blog-subtitle">DESCRIPCION O RESUMEN DEL ARTICULO EN 1-2 LINEAS</p>
    </div>
  </section>

  <!-- CONTENIDO DEL ARTICULO -->
  <article class="blog-container">
    <div class="blog-content">
      <!-- INSERTA TU CONTENIDO AQUI -->
      <p>Primer párrafo del artículo...</p>
      <h2>Título de sección</h2>
      <p>Contenido...</p>
    </div>
  </article>
</body>
</html>

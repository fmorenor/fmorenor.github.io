<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog — CartoData</title>
  <meta name="description" content="Blog de CartoData" />
  <link rel="stylesheet" href="../site.css">

  <script src="../shared.js" defer></script>
  <script defer>
    document.addEventListener('DOMContentLoaded', () => {
      document.body.classList.add('blog-page');
      const params = new URLSearchParams(window.location.search);
      const postId = params.get('id');

      if (!postId) {
        document.getElementById('postContainer').innerHTML = '<div style="padding: 60px 20px; text-align: center; color: #666;"><p>Post no encontrado</p></div>';
        return;
      }

      fetch(`/api/public/posts/${postId}`)
        .then(res => {
          if (!res.ok) {
            throw new Error('Post no encontrado o no publicado');
          }
          return res.json();
        })
        .then(data => {
          if (!data.article) {
            document.getElementById('postContainer').innerHTML = '<div style="padding: 60px 20px; text-align: center; color: #666;"><p>Post no encontrado</p></div>';
            return;
          }

          const article = data.article;
          const months = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
          const date = new Date(article.published_at || article.created_at);
          const dateFormatted = `${date.getDate()} de ${months[date.getMonth()]} de ${date.getFullYear()}`;

          document.title = `${article.title} · Blog — CartoData`;
          document.querySelector('meta[name="description"]').setAttribute('content', article.excerpt || article.title);

          const heroStyle = article.image_url
            ? `background-image: url('${article.image_url}'); background-size: cover; background-position: center;`
            : `background: linear-gradient(135deg, #1a3a52 0%, #0f2a3d 100%);`;

          const html = `
            <section class="blog-hero" style="${heroStyle}">
              ${article.image_url ? `<img src="${article.image_url}" alt="${article.title}" class="blog-hero-bg" />` : ''}
              <div class="blog-hero-overlay"></div>
              <div class="blog-hero-content">
                <div class="blog-eyebrow">
                  <span class="blog-category">${article.category}</span>
                  <div style="margin-top: 8px;">${dateFormatted}</div>
                </div>
                <h1 class="blog-h1">${article.title}</h1>
              </div>
            </section>

            <article class="blog-container">
              <div class="blog-content">${article.content}</div>
            </article>
          `;

          document.getElementById('postContainer').innerHTML = html;
        })
        .catch(err => {
          console.error('Error cargando post:', err);
          document.getElementById('postContainer').innerHTML = '<div style="padding: 60px 20px; text-align: center; color: #666;"><p>Error cargando el post</p></div>';
        });
    });
  </script>

  <style>
    body.blog-page { background: #050816 !important; color: #f8fafc !important; display: block !important; }
    #postContainer { display: block !important; width: 100% !important; columns: auto !important; column-count: auto !important; }
    body.blog-page img { display: block !important; max-width: 100% !important; }

    /* ── HERO ── */
    .blog-hero {
      position: relative !important;
      width: 100% !important;
      min-height: 60vh !important;
      display: flex !important;
      align-items: flex-end !important;
      overflow: hidden !important;
      padding-bottom: 3rem !important;
    }
    .blog-hero-bg {
      position: absolute !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
      object-position: center !important;
    }
    .blog-hero-overlay {
      position: absolute !important;
      inset: 0 !important;
      background: linear-gradient(180deg, rgba(5,8,22,0) 0%, rgba(5,8,22,0.95) 100%) !important;
    }
    .blog-hero-content {
      position: relative !important;
      z-index: 2 !important;
      max-width: 860px !important;
      padding: 0 clamp(1.5rem, 6vw, 4rem) !important;
      width: 100% !important;
    }
    .blog-eyebrow {
      font-size: 0.75rem !important;
      font-weight: 600 !important;
      letter-spacing: 0.12em !important;
      text-transform: uppercase !important;
      color: rgba(255, 255, 255, 0.5) !important;
      margin-bottom: 1rem !important;
    }
    .blog-category {
      display: inline-block !important;
      padding: 0.4rem 1rem !important;
      background: rgba(59, 91, 219, 0.2) !important;
      border-radius: 999px !important;
      font-size: 0.7rem !important;
      font-weight: 600 !important;
      letter-spacing: 0.1em !important;
      text-transform: uppercase !important;
      color: #7dd3fc !important;
      margin-right: 0.8rem !important;
    }
    .blog-h1 {
      font-size: clamp(2rem, 5vw, 3.5rem) !important;
      font-weight: 300 !important;
      line-height: 1.2 !important;
      color: #fff !important;
      margin-bottom: 1rem !important;
    }

    /* ── CONTENEDOR ── */
    .blog-container {
      max-width: 900px !important;
      margin: 0 auto !important;
      padding: clamp(3rem, 8vw, 5rem) clamp(1.5rem, 6vw, 4rem) !important;
    }

    /* ── CONTENIDO ── */
    .blog-content {
      line-height: 1.8 !important;
      font-size: 1.05rem !important;
      color: rgba(255, 255, 255, 0.9) !important;
    }
    .blog-content h2 { font-size: 2rem !important; font-weight: 600 !important; color: #fff !important; margin: 2.5rem 0 1.5rem !important; }
    .blog-content h3 { font-size: 1.4rem !important; font-weight: 600 !important; color: #fff !important; margin: 2rem 0 1rem !important; }
    .blog-content p { margin-bottom: 1.5rem !important; color: rgba(255, 255, 255, 0.9) !important; }
    .blog-content strong { color: #fff !important; font-weight: 600 !important; }
    .blog-content em { font-style: italic !important; color: rgba(255,255,255,0.9) !important; }
    .blog-content a { color: #7dd3fc !important; text-decoration: none !important; border-bottom: 1px solid rgba(125,211,252,0.3) !important; }
    .blog-content a:hover { border-bottom-color: rgba(125,211,252,0.8) !important; }
    .blog-content ul, .blog-content ol { margin: 1.5rem 0 1.5rem 2rem !important; color: rgba(255, 255, 255, 0.9) !important; }
    .blog-content li { margin-bottom: 0.8rem !important; color: rgba(255, 255, 255, 0.9) !important; }
    .blog-content blockquote { border-left: 4px solid #7dd3fc !important; padding-left: 1.5rem !important; margin: 2rem 0 !important; color: rgba(255,255,255,0.8) !important; font-style: italic !important; }
    .blog-content pre { background: rgba(0,0,0,0.3) !important; border: 1px solid rgba(125,211,252,0.2) !important; border-radius: 6px !important; padding: 1.5rem !important; overflow-x: auto !important; margin: 2rem 0 !important; font-family: 'Courier New', monospace !important; }
    .blog-content code { font-family: 'Courier New', monospace !important; font-size: 0.9em !important; color: #7dd3fc !important; }
    .blog-content img { max-width: 100% !important; height: auto !important; border-radius: 8px !important; margin: 2rem 0 !important; }

    /* ── VIDEOS EMBEBIDOS ── */
    .blog-content .video-container {
      position: relative !important;
      width: 100% !important;
      padding-bottom: 56.25% !important;
      height: 0 !important;
      overflow: hidden !important;
      margin: 2rem 0 !important;
      border-radius: 8px !important;
    }
    .blog-content .video-container iframe {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      border: none !important;
      border-radius: 8px !important;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 768px) {
      .blog-hero { min-height: 50vh !important; }
      .blog-content { font-size: 1rem !important; }
      .blog-content h2 { font-size: 1.6rem !important; }
      .blog-content h3 { font-size: 1.2rem !important; }
    }
  </style>
</head>

<body>
  <div id="postContainer" style="min-height: 60vh; display: flex; align-items: center; justify-content: center;">
    <div style="text-align: center; color: #999;">
      <p>Cargando post...</p>
    </div>
  </div>
</body>

</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Artículo Builder — CartoData Blog</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }
    body { background: #050816; color: #f8fafc; font-family: 'DM Sans', system-ui, sans-serif; display: flex; min-height: 100vh; }

    .builder-header { position: fixed; top: 0; left: 0; right: 0; height: 60px; background: rgba(5,8,22,0.95); border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; padding: 0 2rem; z-index: 1000; }
    .builder-header h1 { font-size: 1.2rem; font-weight: 600; }

    .builder-container { display: flex; width: 100%; margin-top: 60px; }

    .builder-form-panel { width: 40%; padding: 2rem; overflow-y: auto; height: calc(100vh - 60px); border-right: 1px solid rgba(255,255,255,0.1); }

    .builder-form-group { margin-bottom: 1.5rem; }
    .builder-form-group label { display: block; font-size: 0.85rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: rgba(255,255,255,0.6); margin-bottom: 0.5rem; }
    .builder-form-group input, .builder-form-group select, .builder-form-group textarea {
      width: 100%; padding: 0.75rem; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); border-radius: 6px; color: #f8fafc; font-family: inherit; font-size: 0.95rem; transition: all 250ms;
    }
    .builder-form-group input:focus, .builder-form-group select:focus, .builder-form-group textarea:focus { outline: none; background: rgba(255,255,255,0.08); border-color: #3b5bdb; }
    .builder-form-group textarea { resize: vertical; min-height: 80px; font-family: inherit; font-size: 0.95rem; }

    .builder-help-text { font-size: 0.8rem; color: rgba(255,255,255,0.4); margin-top: 0.4rem; }

    .builder-content-section { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; padding: 1rem; margin-bottom: 1rem; }
    .builder-content-section h4 { font-size: 0.9rem; font-weight: 600; margin-bottom: 0.8rem; color: rgba(255,255,255,0.8); }

    .builder-block-controls { display: flex; gap: 0.5rem; margin-bottom: 0.8rem; flex-wrap: wrap; }
    .builder-block-btn { padding: 0.4rem 0.8rem; background: rgba(59,91,219,0.2); border: 1px solid #3b5bdb; border-radius: 4px; color: #7dd3fc; font-size: 0.75rem; font-weight: 600; cursor: pointer; transition: all 250ms; }
    .builder-block-btn:hover { background: rgba(59,91,219,0.4); }

    .builder-blocks-list { max-height: 400px; overflow-y: auto; }

    .builder-block-item { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 4px; padding: 0.8rem; margin-bottom: 0.6rem; display: flex; justify-content: space-between; align-items: center; cursor: grab; user-select: none; transition: all 200ms; }
    .builder-block-item:active { cursor: grabbing; }
    .builder-block-item.drag-over { background: rgba(59,91,219,0.2); border-color: #3b5bdb; }
    .builder-block-item.dragging { opacity: 0.5; background: rgba(255,255,255,0.05); }
    .builder-block-item span { font-size: 0.9rem; }
    .builder-block-remove { background: rgba(244,63,94,0.2); border: 1px solid #f43f5e; color: #f43f5e; padding: 0.3rem 0.6rem; border-radius: 3px; font-size: 0.75rem; cursor: pointer; transition: all 200ms; }
    .builder-block-remove:hover { background: rgba(244,63,94,0.4); }

    .builder-preview-panel { width: 60%; padding: 2rem; overflow-y: auto; height: calc(100vh - 60px); background: rgba(255,255,255,0.02); }

    .builder-preview-header { position: sticky; top: 0; background: rgba(5,8,22,0.95); padding: 1rem 0; margin-bottom: 2rem; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; gap: 1rem; }

    .builder-preview-btn { padding: 0.6rem 1.2rem; background: #3b5bdb; border: none; border-radius: 6px; color: #fff; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: background 250ms; }
    .builder-preview-btn:hover { background: #2d4bbd; }

    .builder-preview-content { max-width: 900px; }

    .builder-hero-preview { width: 100%; height: 300px; border-radius: 8px; object-fit: cover; margin-bottom: 2rem; }

    .builder-meta { display: flex; gap: 1rem; margin-bottom: 1.5rem; font-size: 0.9rem; color: rgba(255,255,255,0.6); }
    .builder-category-badge { display: inline-block; padding: 0.35rem 0.9rem; background: rgba(59,91,219,0.2); border-radius: 999px; font-size: 0.7rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #7dd3fc; }

    .builder-preview-content h1 { font-size: 2rem; font-weight: 600; color: #fff; margin: 1rem 0; line-height: 1.3; }
    .builder-preview-content h2 { font-size: 1.6rem; font-weight: 600; color: #fff; margin: 1.5rem 0 0.8rem; }
    .builder-preview-content h3 { font-size: 1.3rem; font-weight: 500; color: #fff; margin: 1.2rem 0 0.6rem; }
    .builder-preview-content p { margin-bottom: 1rem; line-height: 1.8; color: rgba(255,255,255,0.9); }
    .builder-preview-content ul { margin: 1rem 0 1rem 2rem; }
    .builder-preview-content li { margin-bottom: 0.5rem; }
    .builder-preview-content strong { font-weight: 600; color: #fff; }
    .builder-preview-content a { color: #7dd3fc; text-decoration: none; border-bottom: 1px solid rgba(125,211,252,0.3); }
    .builder-preview-content a:hover { border-bottom-color: rgba(125,211,252,0.8); }

    .builder-video-container { position: relative; width: 100%; padding-bottom: 56.25%; height: 0; overflow: hidden; margin: 1.5rem 0; border-radius: 8px; }
    .builder-video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }

    .builder-upload-zone { border: 2px dashed rgba(125,211,252,0.5); border-radius: 6px; padding: 1.5rem; text-align: center; cursor: pointer; transition: all 250ms; background: rgba(125,211,252,0.05); }
    .builder-upload-zone:hover { border-color: #7dd3fc; background: rgba(125,211,252,0.1); }
    .builder-upload-zone.drag-over { border-color: #7dd3fc; background: rgba(125,211,252,0.15); }
    .builder-upload-zone p { font-size: 0.85rem; color: rgba(255,255,255,0.7); margin-bottom: 0.5rem; }
    .builder-upload-zone input[type="file"] { display: none; }
    .builder-uploaded-images { display: grid; grid-template-columns: 1fr; gap: 0.8rem; margin-top: 1rem; max-height: 200px; overflow-y: auto; }
    .builder-uploaded-item { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 4px; padding: 0.6rem; display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; }
    .builder-uploaded-item button { background: rgba(59,91,219,0.2); border: 1px solid #7dd3fc; color: #7dd3fc; padding: 0.2rem 0.6rem; border-radius: 3px; cursor: pointer; font-size: 0.7rem; }
    .builder-uploaded-item button:hover { background: rgba(59,91,219,0.4); }
    .builder-upload-progress { width: 100%; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; margin-top: 0.8rem; overflow: hidden; display: none; }
    .builder-upload-progress.active { display: block; }
    .builder-upload-progress-bar { height: 100%; background: #7dd3fc; width: 0%; transition: width 200ms; }

    @media (max-width: 1024px) {
      .builder-container { flex-direction: column; }
      .builder-form-panel, .builder-preview-panel { width: 100%; height: auto; }
    }
  </style>
</head>

<body>
  <div class="builder-header">
    <h1>Artículo Builder — CartoData Blog</h1>
  </div>

  <div class="builder-container">
    <!-- FORMULARIO -->
    <div class="builder-form-panel">
      <form id="builderForm">
        <div class="builder-form-group">
          <label for="title">Título del artículo</label>
          <input type="text" id="title" placeholder="Ej: Mapeo Aéreo de Yacimientos" required />
        </div>

        <div class="builder-form-group">
          <label for="category">Categoría</label>
          <select id="category" required>
            <option value="">Selecciona una categoría</option>
            <option value="ciudades">Ciudades</option>
            <option value="mineria">Minería</option>
            <option value="gobierno">Gobierno</option>
            <option value="infraestructura">Infraestructura</option>
            <option value="construccion">Construcción</option>
            <option value="lidar">Lidar</option>
            <option value="vision360">Visión 360</option>
            <option value="ecarto">eCarto</option>
            <option value="podcast">Podcast</option>
          </select>
        </div>

        <div class="builder-form-group">
          <label for="date">Fecha</label>
          <input type="date" id="date" required />
        </div>

        <div class="builder-form-group">
          <label for="description">Descripción corta</label>
          <textarea id="description" placeholder="Resumen para buscadores" required></textarea>
        </div>

        <div class="builder-form-group">
          <label for="imageUrl">URL de imagen hero</label>
          <input type="url" id="imageUrl" placeholder="https://images.unsplash.com/..." />
        </div>
      </form>

      <!-- IMPORTADOR DE WORD -->
      <div class="builder-content-section">
        <h4>📥 Pega contenido de Word</h4>
        <textarea id="pasteContent" placeholder="Copia y pega aquí todo tu contenido del Word..." style="width: 100%; min-height: 120px; padding: 0.75rem; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); border-radius: 6px; color: #f8fafc; font-family: inherit; font-size: 0.85rem; resize: vertical;"></textarea>
        <button class="builder-preview-btn" onclick="autoFormatContent()" style="width: 100%; margin-top: 0.8rem;">✨ Auto-formatear</button>
      </div>

      <!-- REFERENCIAS DE IMÁGENES -->
      <div class="builder-content-section">
        <h4>🖼️ Imágenes (R2)</h4>
        <p class="builder-help-text" style="margin-bottom: 0.5rem;">Sube manualmente a R2 y pega la URL aquí</p>
        <div style="display: flex; gap: 0.5rem; align-items: flex-end;">
          <input type="text" id="imageUrlInput" placeholder="https://pub-0b66dd4321604e288d1651690d880dc2.r2.dev/imagen.jpg" style="flex: 1;" />
          <button type="button" id="addImageBtn" class="builder-block-btn" style="padding: 0.75rem 1.2rem;">Agregar</button>
        </div>
        <div class="builder-uploaded-images" id="uploadedImages"></div>
      </div>

      <!-- EDITOR DE CONTENIDO -->
      <div class="builder-content-section">
        <h4>📝 Contenido del artículo</h4>
        <div class="builder-block-controls">
          <button class="builder-block-btn" onclick="addBlock('h2')">+ H2</button>
          <button class="builder-block-btn" onclick="addBlock('h3')">+ H3</button>
          <button class="builder-block-btn" onclick="addBlock('p')">+ Párrafo</button>
          <button class="builder-block-btn" onclick="addBlock('ul')">+ Lista</button>
          <button class="builder-block-btn" onclick="addBlock('image')">+ Imagen</button>
          <button class="builder-block-btn" onclick="addBlock('video')">+ Video</button>
        </div>
        <div class="builder-blocks-list" id="blocksList"></div>
      </div>

      <!-- BOTONES DE ACCIÓN -->
      <div style="display: flex; gap: 1rem;">
        <button class="builder-preview-btn" id="downloadBtn" style="flex: 1;">⬇️ Descargar HTML</button>
        <button class="builder-preview-btn" id="copyBtn" style="flex: 1;">📋 Copiar Tarjeta</button>
      </div>
    </div>

    <!-- PREVIEW -->
    <div class="builder-preview-panel">
      <div class="builder-preview-header">
        <span style="font-size: 0.9rem; color: rgba(255,255,255,0.6);">Preview en vivo ↓</span>
      </div>
      <div class="builder-preview-content" id="preview">
        <p style="color: rgba(255,255,255,0.5);">Los cambios aparecen aquí...</p>
      </div>
    </div>
  </div>

  <script>
    let blocks = [];
    const form = document.getElementById('builderForm');
    const preview = document.getElementById('preview');
    const blocksList = document.getElementById('blocksList');
    const downloadBtn = document.getElementById('downloadBtn');
    const copyBtn = document.getElementById('copyBtn');

    form.addEventListener('input', updatePreview);
    form.addEventListener('change', updatePreview);
    downloadBtn.addEventListener('click', downloadArticle);
    copyBtn.addEventListener('click', copyToIndex);

    document.getElementById('date').value = new Date().toISOString().split('T')[0];

    function addBlock(type) {
      const id = Date.now();
      const block = { id, type, content: '', items: [] };
      blocks.push(block);
      renderBlocks();
      updatePreview();
    }

    function removeBlock(id) {
      blocks = blocks.filter(b => b.id !== id);
      renderBlocks();
      updatePreview();
    }

    function moveBlock(id, direction) {
      const index = blocks.findIndex(b => b.id === id);
      if (index === -1) return;

      const newIndex = index + direction;
      if (newIndex < 0 || newIndex >= blocks.length) return;

      const temp = blocks[index];
      blocks[index] = blocks[newIndex];
      blocks[newIndex] = temp;

      renderBlocks();
      updatePreview();
    }

    function autoFormatContent() {
      const pasteArea = document.getElementById('pasteContent');
      const content = pasteArea.value.trim();

      if (!content) {
        alert('Pega contenido primero');
        return;
      }

      blocks = [];
      const paragraphs = content.split(/\n\n+/).map(p => p.trim()).filter(p => p);

      let currentList = [];
      let isFirstParagraph = true;

      paragraphs.forEach((paragraph, index) => {
        // Detectar si es una lista
        if (paragraph.match(/^[\-\*•]/m)) {
          const items = paragraph.split('\n').map(line => line.trim().replace(/^[\-\*•]\s*/, ''));
          if (currentList.length > 0) {
            const id = Date.now() + Math.random();
            blocks.push({ id, type: 'ul', content: currentList.join('\n') });
            currentList = [];
          }
          currentList = currentList.concat(items);
        } else {
          // Guardar lista anterior si existe
          if (currentList.length > 0) {
            const id = Date.now() + Math.random();
            blocks.push({ id, type: 'ul', content: currentList.join('\n') });
            currentList = [];
          }

          // Detectar si es YouTube
          if (paragraph.includes('youtube.com') || paragraph.includes('youtu.be')) {
            const id = Date.now() + Math.random();
            blocks.push({ id, type: 'video', content: paragraph });
          }
          // Detectar títulos (párrafos cortos al inicio o muy cortos)
          else if (isFirstParagraph && paragraph.length < 80) {
            const id = Date.now() + Math.random();
            blocks.push({ id, type: 'h2', content: paragraph });
            isFirstParagraph = false;
          } else if (paragraph.length < 60 && !isFirstParagraph && index < paragraphs.length / 2) {
            const id = Date.now() + Math.random();
            blocks.push({ id, type: 'h3', content: paragraph });
          } else {
            const id = Date.now() + Math.random();
            blocks.push({ id, type: 'p', content: paragraph });
            isFirstParagraph = false;
          }
        }
      });

      // Guardar última lista si existe
      if (currentList.length > 0) {
        const id = Date.now() + Math.random();
        blocks.push({ id, type: 'ul', content: currentList.join('\n') });
      }

      pasteArea.value = '';
      renderBlocks();
      updatePreview();
      alert('✨ ' + blocks.length + ' bloques creados automáticamente');
    }

    function updateBlockContent(id, content) {
      const block = blocks.find(b => b.id === id);
      if (block) block.content = content;
      updatePreview();
    }

    let draggedBlock = null;

    function renderBlocks() {
      blocksList.innerHTML = blocks.map((block, index) => {
        const label = { h2: 'Título (H2)', h3: 'Subtítulo (H3)', p: 'Párrafo', ul: 'Lista', image: 'Imagen', video: 'Video' }[block.type];
        let placeholder = 'Escribe aquí...';
        if (block.type === 'image') placeholder = 'https://ejemplo.com/imagen.jpg';
        if (block.type === 'video') placeholder = 'https://youtube.com/watch?v=...';
        const canMoveUp = index > 0;
        const canMoveDown = index < blocks.length - 1;
        return `
          <div class="builder-block-item" draggable="true" data-block-id="${block.id}"
            ondragstart="draggedBlock = ${block.id}; this.classList.add('dragging');"
            ondragend="this.classList.remove('dragging');"
            ondragover="event.preventDefault(); this.classList.add('drag-over');"
            ondragleave="this.classList.remove('drag-over');"
            ondrop="event.preventDefault(); dropBlock(${block.id}); this.classList.remove('drag-over');">
            <span>⋮⋮</span>
            <span>${label}</span>
            <input type="text" placeholder="${placeholder}" value="${block.content}"
              onchange="updateBlockContent(${block.id}, this.value)"
              style="width: 200px; padding: 0.4rem; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); border-radius: 3px; color: #f8fafc; font-size: 0.85rem;" />
            <button class="builder-block-remove" onclick="removeBlock(${block.id})">✕</button>
          </div>
        `;
      }).join('');
    }

    function dropBlock(targetId) {
      if (draggedBlock === null || draggedBlock === targetId) return;

      const draggedIndex = blocks.findIndex(b => b.id === draggedBlock);
      const targetIndex = blocks.findIndex(b => b.id === targetId);

      if (draggedIndex === -1 || targetIndex === -1) return;

      const draggedBlockObj = blocks[draggedIndex];
      blocks.splice(draggedIndex, 1);
      blocks.splice(targetIndex, 0, draggedBlockObj);

      draggedBlock = null;
      renderBlocks();
      updatePreview();
    }

    function updatePreview() {
      const title = document.getElementById('title').value;
      const category = document.getElementById('category').value;
      const date = formatDate(document.getElementById('date').value);
      const description = document.getElementById('description').value;
      const imageUrl = document.getElementById('imageUrl').value || 'https://images.unsplash.com/photo-1500462918059-b1a0136e4b00?w=900&h=400&fit=crop';

      let html = '';

      if (imageUrl) {
        html += '<img src="' + escapeHtml(imageUrl) + '" alt="Hero" class="builder-hero-preview" />';
      }

      if (category || date) {
        html += '<div class="builder-meta">';
        if (category) {
          html += '<span class="builder-category-badge">' + getCategoryLabel(category) + '</span>';
        }
        if (date) {
          html += '<span>' + date + '</span>';
        }
        html += '</div>';
      }

      if (title) {
        html += '<h1>' + escapeHtml(title) + '</h1>';
      }

      if (description) {
        html += '<p><em>' + escapeHtml(description) + '</em></p>';
      }

      blocks.forEach(block => {
        if (block.type === 'h2') {
          html += '<h2>' + escapeHtml(block.content) + '</h2>';
        } else if (block.type === 'h3') {
          html += '<h3>' + escapeHtml(block.content) + '</h3>';
        } else if (block.type === 'p') {
          html += '<p>' + linkifyText(escapeHtml(block.content)) + '</p>';
        } else if (block.type === 'ul') {
          const items = block.content.split('\n').filter(i => i.trim());
          if (items.length) {
            html += '<ul>' + items.map(item => '<li>' + linkifyText(escapeHtml(item)) + '</li>').join('') + '</ul>';
          }
        } else if (block.type === 'image') {
          if (block.content) {
            html += '<img src="' + escapeHtml(block.content) + '" alt="Contenido" style="width: 100%; height: auto; margin: 1.5rem 0; border-radius: 8px;" />';
          }
        } else if (block.type === 'video') {
          const videoId = extractYouTubeId(block.content);
          if (videoId) {
            html += '<div class="builder-video-container"><iframe src="https://www.youtube.com/embed/' + videoId + '" allowfullscreen><\/iframe><\/div>';
          }
        }
      });

      preview.innerHTML = html || '<p style="color: rgba(255,255,255,0.5);">Los cambios aparecen aquí...</p>';
    }

    function linkifyText(text) {
      return text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
    }

    function extractYouTubeId(url) {
      if (!url) return null;
      const patterns = [
        /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/shorts\/)([a-zA-Z0-9_-]{11})/,
        /([a-zA-Z0-9_-]{11})/
      ];
      for (let pattern of patterns) {
        const match = url.match(pattern);
        if (match && match[1]) return match[1];
      }
      return null;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function formatDate(dateStr) {
      if (!dateStr) return '';
      const date = new Date(dateStr);
      const months = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
      return date.getDate() + ' de ' + months[date.getMonth()] + ' de ' + date.getFullYear();
    }

    function getCategoryLabel(value) {
      const labels = { ciudades: 'Ciudades', mineria: 'Minería', gobierno: 'Gobierno', infraestructura: 'Infraestructura', construccion: 'Construcción', lidar: 'Lidar', vision360: 'Visión 360', ecarto: 'eCarto', podcast: 'Podcast' };
      return labels[value] || value;
    }

    function downloadArticle() {
      const title = document.getElementById('title').value;
      const category = document.getElementById('category').value;
      const date = document.getElementById('date').value;
      const description = document.getElementById('description').value;
      const imageUrl = document.getElementById('imageUrl').value;

      if (!title || !category || !date || !description || !blocks.length) {
        alert('Completa: Título, Categoría, Fecha, Descripción y agrega contenido');
        return;
      }

      const filename = title.toLowerCase().replace(/[áéíóú]/g, c => ({á:'a',é:'e',í:'i',ó:'o',ú:'u'}[c])).replace(/\s+/g, '-').replace(/[^a-z0-9-]/g, '').substring(0, 50);

      const html = generateArticleHtml(title, category, date, description, imageUrl);

      const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename + '.html';
      a.click();
      URL.revokeObjectURL(url);
    }

    function generateArticleHtml(title, category, date, description, imageUrl) {
      const dateObj = new Date(date);
      const months = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
      const formattedDate = dateObj.getDate() + ' de ' + months[dateObj.getMonth()] + ' de ' + dateObj.getFullYear();

      let content = '';
      blocks.forEach(block => {
        if (block.type === 'h2') {
          content += '<h2>' + escapeHtml(block.content) + '</h2>\n';
        } else if (block.type === 'h3') {
          content += '<h3>' + escapeHtml(block.content) + '</h3>\n';
        } else if (block.type === 'p') {
          content += '<p>' + linkifyText(escapeHtml(block.content)) + '</p>\n';
        } else if (block.type === 'ul') {
          const items = block.content.split('\n').filter(i => i.trim());
          if (items.length) {
            content += '<ul>\n' + items.map(item => '<li>' + linkifyText(escapeHtml(item)) + '</li>').join('\n') + '\n</ul>\n';
          }
        } else if (block.type === 'image') {
          if (block.content) {
            content += '<img src="' + escapeHtml(block.content) + '" alt="Contenido" style="width: 100%; height: auto; margin: 1.5rem 0; border-radius: 8px;" />\n';
          }
        } else if (block.type === 'video') {
          const videoId = extractYouTubeId(block.content);
          if (videoId) {
            content += '<div style="position: relative; width: 100%; padding-bottom: 56.25%; height: 0; overflow: hidden; margin: 1.5rem 0; border-radius: 8px;"><iframe src="https://www.youtube.com/embed/' + videoId + '" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none;" allowfullscreen><\/iframe><\/div>\n';
          }
        }
      });

      return `<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>${escapeHtml(title)} · Blog — CartoData</title>
  <meta name="description" content="${escapeHtml(description)}" />
  <meta name="article:published_time" content="${dateObj.toISOString()}" />
  <script src="../shared.js" defer><\/script>
</head>
<body>
  <section class="blog-hero" style="background-image: url('${escapeHtml(imageUrl)}');">
    <img src="${escapeHtml(imageUrl)}" alt="Hero" class="blog-hero-bg" />
    <div class="blog-hero-overlay"><\/div>
    <div class="blog-hero-content">
      <div class="blog-eyebrow">
        <span class="blog-category">${getCategoryLabel(category)}</span>
        ${formattedDate}
      <\/div>
      <h1 class="blog-h1">${escapeHtml(title)}</h1>
      <p class="blog-subtitle">${escapeHtml(description)}</p>
    <\/div>
  <\/section>
  <article class="blog-container">
    <div class="blog-content">
      ${content}
    <\/div>
  <\/article>
<\/body>
<\/html>`;
    }

    function copyToIndex() {
      const title = document.getElementById('title').value;
      const category = document.getElementById('category').value;
      const date = document.getElementById('date').value;
      const description = document.getElementById('description').value;
      const imageUrl = document.getElementById('imageUrl').value;

      if (!title || !category || !date || !description) {
        alert('Completa: Título, Categoría, Fecha y Descripción');
        return;
      }

      const filename = title.toLowerCase().replace(/[áéíóú]/g, c => ({á:'a',é:'e',í:'i',ó:'o',ú:'u'}[c])).replace(/\s+/g, '-').replace(/[^a-z0-9-]/g, '').substring(0, 50);
      const dateObj = new Date(date);
      const months = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
      const formattedDate = dateObj.getDate() + ' de ' + months[dateObj.getMonth()] + ' de ' + dateObj.getFullYear();

      const code = `<a href="./${filename}.html" class="blog-article-card" data-category="${category}">
  <img src="${escapeHtml(imageUrl)}" alt="Artículo" class="blog-article-image" />
  <div class="blog-article-content">
    <span class="blog-article-category">${getCategoryLabel(category)}</span>
    <div class="blog-article-date">${formattedDate}</div>
    <h3 class="blog-article-title">${escapeHtml(title)}</h3>
    <p class="blog-article-excerpt">${escapeHtml(description)}</p>
    <span class="blog-article-link">LEER MÁS</span>
  </div>
</a>`;

      navigator.clipboard.writeText(code).then(() => {
        alert('✅ Código copiado');
      });
    }

    // ── INPUT DE URL DE IMAGEN ──
    const imageUrlInput = document.getElementById('imageUrlInput');
    const addImageBtn = document.getElementById('addImageBtn');
    const uploadedImages = document.getElementById('uploadedImages');

    addImageBtn.addEventListener('click', () => {
      const url = imageUrlInput.value.trim();
      if (!url) {
        alert('⚠️ Pega la URL de la imagen');
        return;
      }
      addUploadedImage(url);
      imageUrlInput.value = '';
    });

    imageUrlInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') addImageBtn.click();
    });

    function addUploadedImage(url) {
      const fileName = url.split('/').pop() || 'imagen';
      const item = document.createElement('div');
      item.className = 'builder-uploaded-item';
      item.innerHTML = `
        <span>${fileName}</span>
        <button type="button" onclick="copyImageUrl('${url}')">📋 Copiar URL</button>
        <button type="button" onclick="this.parentElement.remove()">🗑️ Quitar</button>
      `;
      uploadedImages.appendChild(item);
    }

    function copyImageUrl(url) {
      navigator.clipboard.writeText(url).then(() => {
        alert('✅ URL copiada: ' + url);
      });
    }

    updatePreview();
  </script>
</body>
</html>

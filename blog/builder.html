<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Artículo Builder — CartoData Blog</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }
    body {
      background: #050816;
      color: #f8fafc;
      font-family: 'DM Sans', system-ui, sans-serif;
      display: flex;
      min-height: 100vh;
    }

    .builder-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: rgba(5, 8, 22, 0.95);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      padding: 0 2rem;
      z-index: 1000;
    }

    .builder-header h1 {
      font-size: 1.2rem;
      font-weight: 600;
    }

    .builder-container {
      display: flex;
      width: 100%;
      margin-top: 60px;
    }

    .builder-form-panel {
      width: 40%;
      padding: 2rem;
      overflow-y: auto;
      height: calc(100vh - 60px);
      border-right: 1px solid rgba(255, 255, 255, 0.1);
    }

    .builder-form-group {
      margin-bottom: 1.5rem;
    }

    .builder-form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 0.5rem;
    }

    .builder-form-group input,
    .builder-form-group select,
    .builder-form-group textarea {
      width: 100%;
      padding: 0.75rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      color: #f8fafc;
      font-family: inherit;
      font-size: 0.95rem;
      transition: all 250ms;
    }

    .builder-form-group input:focus,
    .builder-form-group select:focus,
    .builder-form-group textarea:focus {
      outline: none;
      background: rgba(255, 255, 255, 0.08);
      border-color: #3b5bdb;
    }

    .builder-form-group textarea {
      resize: vertical;
      min-height: 120px;
      font-family: 'Courier New', monospace;
      font-size: 0.9rem;
    }

    .builder-help-text {
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.4);
      margin-top: 0.4rem;
      font-style: italic;
    }

    .builder-preview-panel {
      width: 60%;
      padding: 2rem;
      overflow-y: auto;
      height: calc(100vh - 60px);
      background: rgba(255, 255, 255, 0.02);
    }

    .builder-preview-header {
      position: sticky;
      top: 0;
      background: rgba(5, 8, 22, 0.95);
      padding: 1rem 0;
      margin-bottom: 2rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      gap: 1rem;
    }

    .builder-preview-btn {
      padding: 0.6rem 1.2rem;
      background: #3b5bdb;
      border: none;
      border-radius: 6px;
      color: #fff;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 250ms;
    }

    .builder-preview-btn:hover {
      background: #2d4bbd;
    }

    .builder-preview-content {
      max-width: 900px;
      line-height: 1.8;
      color: rgba(255, 255, 255, 0.9);
    }

    .builder-preview-content h2 {
      font-size: 1.8rem;
      font-weight: 600;
      color: #fff;
      margin: 2rem 0 1rem 0;
      line-height: 1.3;
    }

    .builder-preview-content h3 {
      font-size: 1.3rem;
      font-weight: 500;
      color: #fff;
      margin: 1.5rem 0 0.8rem 0;
    }

    .builder-preview-content p {
      margin-bottom: 1rem;
    }

    .builder-preview-content ul,
    .builder-preview-content ol {
      margin: 1rem 0 1rem 2rem;
    }

    .builder-preview-content li {
      margin-bottom: 0.5rem;
    }

    .builder-preview-content a {
      color: #7dd3fc;
      text-decoration: none;
      border-bottom: 1px solid rgba(125, 211, 252, 0.3);
    }

    .builder-preview-content a:hover {
      border-bottom-color: rgba(125, 211, 252, 0.8);
    }

    .builder-meta {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.6);
    }

    .builder-category-badge {
      display: inline-block;
      padding: 0.35rem 0.9rem;
      background: rgba(59, 91, 219, 0.2);
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #7dd3fc;
    }

    @media (max-width: 1024px) {
      .builder-container { flex-direction: column; }
      .builder-form-panel, .builder-preview-panel {
        width: 100%;
        height: auto;
        border: none;
      }
      .builder-form-panel { border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
    }
  </style>
</head>

<body>
  <div class="builder-header">
    <h1>Artículo Builder — CartoData Blog</h1>
  </div>

  <div class="builder-container">
    <div class="builder-form-panel">
      <form id="builderForm">
        <div class="builder-form-group">
          <label for="title">Título del artículo</label>
          <input type="text" id="title" placeholder="Ej: Mapeo Aéreo de Yacimientos" required />
        </div>

        <div class="builder-form-group">
          <label for="category">Categoría</label>
          <select id="category" required>
            <option value="">Selecciona una categoría</option>
            <option value="ciudades">Ciudades</option>
            <option value="mineria">Minería</option>
            <option value="gobierno">Gobierno</option>
            <option value="infraestructura">Infraestructura</option>
            <option value="construccion">Construcción</option>
            <option value="lidar">Lidar</option>
            <option value="vision360">Visión 360</option>
            <option value="ecarto">eCarto</option>
          </select>
        </div>

        <div class="builder-form-group">
          <label for="date">Fecha</label>
          <input type="date" id="date" required />
        </div>

        <div class="builder-form-group">
          <label for="description">Descripción corta</label>
          <textarea id="description" placeholder="Resumen para buscadores (160 caracteres)" required></textarea>
          <div class="builder-help-text" id="descChar">0 caracteres</div>
        </div>

        <div class="builder-form-group">
          <label for="imageUrl">URL de imagen hero</label>
          <input type="url" id="imageUrl" placeholder="https://images.unsplash.com/..." />
        </div>

        <div class="builder-form-group">
          <label for="content">Contenido (Markdown básico)</label>
          <textarea id="content" placeholder="## Título&#10;Párrafo.&#10;&#10;### Subtítulo&#10;- Punto 1&#10;&#10;[link](url)" required></textarea>
        </div>
      </form>
    </div>

    <div class="builder-preview-panel">
      <div class="builder-preview-header">
        <button class="builder-preview-btn" id="downloadBtn">⬇️ Descargar HTML</button>
        <button class="builder-preview-btn" id="copyBtn">📋 Copiar al index</button>
      </div>
      <div class="builder-preview-content" id="preview">
        <p style="color: rgba(255,255,255,0.5);">El preview se actualiza mientras escribes...</p>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('builderForm');
    const preview = document.getElementById('preview');
    const downloadBtn = document.getElementById('downloadBtn');
    const copyBtn = document.getElementById('copyBtn');
    const descChar = document.getElementById('descChar');

    // Event listeners
    form.addEventListener('input', updatePreview);
    form.addEventListener('change', updatePreview);
    downloadBtn.addEventListener('click', downloadArticle);
    copyBtn.addEventListener('click', copyToIndex);

    document.getElementById('description').addEventListener('input', function() {
      descChar.textContent = this.value.length + ' caracteres';
    });

    // Set today's date
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('date').value = today;

    function updatePreview() {
      const title = document.getElementById('title').value;
      const category = document.getElementById('category').value;
      const date = formatDate(document.getElementById('date').value);
      const description = document.getElementById('description').value;
      const imageUrl = document.getElementById('imageUrl').value || 'https://images.unsplash.com/photo-1500462918059-b1a0136e4b00?w=600&h=400&fit=crop';
      const content = document.getElementById('content').value;

      let html = '';

      if (title || date || category) {
        html += '<div class="builder-meta">';
        if (category) {
          html += '<span class="builder-category-badge">' + getCategoryLabel(category) + '</span>';
        }
        if (date) {
          html += '<span>' + date + '</span>';
        }
        html += '</div>';
      }

      if (title) {
        html += '<h2>' + escapeHtml(title) + '</h2>';
      }

      if (description) {
        html += '<p><em>' + escapeHtml(description) + '</em></p>';
      }

      if (imageUrl) {
        html += '<img src="' + escapeHtml(imageUrl) + '" alt="Imagen" style="width: 100%; border-radius: 8px; margin: 2rem 0;" />';
      }

      if (content) {
        html += markdownToHtml(content);
      }

      preview.innerHTML = html || '<p style="color: rgba(255,255,255,0.5);">El preview se actualiza mientras escribes...</p>';
    }

    function markdownToHtml(md) {
      let html = '';
      const lines = md.split('\n');
      let inList = false;

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i].trim();

        if (!line) {
          if (inList) {
            html += '</ul>';
            inList = false;
          }
          continue;
        }

        if (line.startsWith('### ')) {
          html += '<h3>' + escapeHtml(line.substring(4)) + '</h3>';
        } else if (line.startsWith('## ')) {
          html += '<h2>' + escapeHtml(line.substring(3)) + '</h2>';
        } else if (line.startsWith('- ')) {
          if (!inList) {
            html += '<ul>';
            inList = true;
          }
          html += '<li>' + linkifyText(escapeHtml(line.substring(2))) + '</li>';
        } else {
          if (inList) {
            html += '</ul>';
            inList = false;
          }
          html += '<p>' + linkifyText(escapeHtml(line)) + '</p>';
        }
      }

      if (inList) html += '</ul>';
      return html;
    }

    function linkifyText(text) {
      return text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function formatDate(dateStr) {
      if (!dateStr) return '';
      const date = new Date(dateStr);
      const months = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
      return date.getDate() + ' de ' + months[date.getMonth()] + ' de ' + date.getFullYear();
    }

    function getCategoryLabel(value) {
      const labels = {
        'ciudades': 'Ciudades',
        'mineria': 'Minería',
        'gobierno': 'Gobierno',
        'infraestructura': 'Infraestructura',
        'construccion': 'Construcción',
        'lidar': 'Lidar',
        'vision360': 'Visión 360',
        'ecarto': 'eCarto'
      };
      return labels[value] || value;
    }

    function downloadArticle() {
      const title = document.getElementById('title').value;
      const category = document.getElementById('category').value;
      const date = document.getElementById('date').value;
      const description = document.getElementById('description').value;
      const imageUrl = document.getElementById('imageUrl').value;
      const content = document.getElementById('content').value;

      if (!title || !category || !date || !description || !content) {
        alert('Por favor completa todos los campos requeridos');
        return;
      }

      const filename = title.toLowerCase()
        .replace(/[áéíóú]/g, function(c) { return {á:'a', é:'e', í:'i', ó:'o', ú:'u'}[c]; })
        .replace(/\s+/g, '-')
        .replace(/[^a-z0-9-]/g, '')
        .substring(0, 50);

      const html = generateArticleHtml(title, category, date, description, imageUrl, content);

      const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename + '.html';
      a.click();
      URL.revokeObjectURL(url);
    }

    function generateArticleHtml(title, category, date, description, imageUrl, content) {
      const dateObj = new Date(date);
      const months = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
      const formattedDate = dateObj.getDate() + ' de ' + months[dateObj.getMonth()] + ' de ' + dateObj.getFullYear();
      const isoDate = dateObj.toISOString();

      const head = '<!DOCTYPE html>\n<html lang="es">\n<head>\n  <meta charset="UTF-8" />\n  <meta name="viewport" content="width=device-width, initial-scale=1.0" />\n  <title>' + escapeHtml(title) + ' · Blog — CartoData</title>\n  <meta name="description" content="' + escapeHtml(description) + '" />\n  <link rel="canonical" href="https://www.cartodata.com/blog/' + escapeHtml(category) + '.html" />\n  <meta property="og:type" content="article" />\n  <meta property="og:title" content="' + escapeHtml(title) + ' · Blog — CartoData" />\n  <meta property="og:description" content="' + escapeHtml(description) + '" />\n  <meta property="og:locale" content="es_MX" />\n  <meta property="og:site_name" content="CartoData" />\n  <meta property="og:image" content="' + escapeHtml(imageUrl) + '" />\n  <meta name="author" content="CartoData" />\n  <meta name="article:published_time" content="' + isoDate + '" />\n  <script src="../shared.js" defer><\/script>\n</head>\n<body>\n  <section class="blog-hero" style="background-image: url(\'' + escapeHtml(imageUrl) + '\');">\n    <img src="' + escapeHtml(imageUrl) + '" alt="Hero" class="blog-hero-bg" />\n    <div class="blog-hero-overlay"><\/div>\n    <div class="blog-hero-content">\n      <div class="blog-eyebrow">\n        <span class="blog-category">' + getCategoryLabel(category) + '<\/span>\n        ' + formattedDate + '\n      <\/div>\n      <h1 class="blog-h1">' + escapeHtml(title) + '<\/h1>\n      <p class="blog-subtitle">' + escapeHtml(description) + '<\/p>\n    <\/div>\n  <\/section>\n  <article class="blog-container">\n    <div class="blog-content">\n      ' + markdownToHtml(content) + '\n    <\/div>\n  <\/article>\n<\/body>\n<\/html>';

      return head;
    }

    function copyToIndex() {
      const title = document.getElementById('title').value;
      const category = document.getElementById('category').value;
      const date = document.getElementById('date').value;
      const description = document.getElementById('description').value;
      const imageUrl = document.getElementById('imageUrl').value;

      if (!title || !category || !date || !description) {
        alert('Por favor completa: Título, Categoría, Fecha y Descripción');
        return;
      }

      const filename = title.toLowerCase()
        .replace(/[áéíóú]/g, function(c) { return {á:'a', é:'e', í:'i', ó:'o', ú:'u'}[c]; })
        .replace(/\s+/g, '-')
        .replace(/[^a-z0-9-]/g, '')
        .substring(0, 50);

      const dateObj = new Date(date);
      const months = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
      const formattedDate = dateObj.getDate() + ' de ' + months[dateObj.getMonth()] + ' de ' + dateObj.getFullYear();

      const code = '<!-- ARTÍCULO: ' + title + ' -->\n      <a href="./' + filename + '.html" class="blog-article-card" data-category="' + category + '">\n        <img src="' + escapeHtml(imageUrl) + '" alt="Artículo" class="blog-article-image" />\n        <div class="blog-article-content">\n          <span class="blog-article-category">' + getCategoryLabel(category) + '<\/span>\n          <div class="blog-article-date">' + formattedDate + '<\/div>\n          <h3 class="blog-article-title">' + escapeHtml(title) + '<\/h3>\n          <p class="blog-article-excerpt">' + escapeHtml(description) + '<\/p>\n          <span class="blog-article-link">LEER MÁS<\/span>\n        <\/div>\n      <\/a>';

      navigator.clipboard.writeText(code).then(function() {
        alert('✅ Código copiado. Pégalo en blog/index.html');
      });
    }

    updatePreview();
  </script>
</body>
</html>
